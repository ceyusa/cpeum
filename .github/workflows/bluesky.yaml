name: BlueSky

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bluesky:

    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    environment:
      name: BlueSky

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check submodule was updated in the merged PR
        id: check
        run: |
          # Commit de `main` antes del merge (base del PR).
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE_SHA:-}" ]; then
            BASE_SHA="HEAD^1"
          fi

          # Puntero del submódulo antes y después del merge.
          OLD_SUB=$(git ls-tree "$BASE_SHA" cpeum-decretos 2>/dev/null | awk '{print $3}')
          NEW_SUB=$(git ls-tree HEAD cpeum-decretos | awk '{print $3}')

          echo "old_sub=$OLD_SUB" >> "$GITHUB_OUTPUT"
          echo "new_sub=$NEW_SUB" >> "$GITHUB_OUTPUT"

          # El PR fusionado actualizó el submódulo si el puntero cambió.
          if [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
            echo "submodule_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "submodule_updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for a new decree commit
        id: check_decree
        if: steps.check.outputs.submodule_updated == 'true'
        run: |
          NEW_SUB="${{ steps.check.outputs.new_sub }}"
          SUBJECT=$(git -C cpeum-decretos show -s --format=%s "$NEW_SUB")

          if echo "$SUBJECT" | grep -qi -e "artículo" -e "fe"; then
            echo "document_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "document_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_hash=$NEW_SUB" >> "$GITHUB_OUTPUT"

      - name: Extract decree description
        if: steps.check_decree.outputs.document_changes == 'true'
        id: desc
        run: |
          NEW_SUB="${{ steps.check_decree.outputs.commit_hash }}"
          DESC=$(git -C cpeum-decretos show -s --format=%B "$NEW_SUB" | awk -v RS='' 'NR == 2' | sed ':a;N;$!ba;s/\n/ /g')
          echo "raw_desc=$DESC" >> "$GITHUB_OUTPUT"

      - name: Compute decree URL
        if: steps.check_decree.outputs.document_changes == 'true'
        id: decree_url
        run: |
          # La página del decreto se genera con scripts/generar_reformas.js.
          npm ci
          DECREE_URL=$(node scripts/generar_reformas.js --url "${{ steps.check_decree.outputs.commit_hash }}")
          echo "url=$DECREE_URL" >> "$GITHUB_OUTPUT"

      - name: Build Bluesky post
        if: steps.check_decree.outputs.document_changes == 'true'
        id: post
        run: |
          URL="${{ steps.decree_url.outputs.url }}"
          RAW_DESC='${{ steps.desc.outputs.raw_desc }}'
          MAX=300
          URL_LEN=$(printf '%s' "$URL" | wc -m)
          GAP=2
          DESC_BUDGET=$((MAX - URL_LEN - GAP))
          if [ "$DESC_BUDGET" -lt 1 ]; then
            DESC_BUDGET=0
          fi
          TRUNCATED_DESC=$(printf '%s' "$RAW_DESC" | head -c "$DESC_BUDGET")
          printf -v POST '%s\n\n%s' "$TRUNCATED_DESC" "$URL"
          echo "post<<EOF" >> "$GITHUB_OUTPUT"
          echo "$POST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post in BlueSky
        if: steps.check_decree.outputs.document_changes == 'true'
        uses: zentered/bluesky-post-action@v0.4.0
        with:
          post: ${{ steps.post.outputs.post }}
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
