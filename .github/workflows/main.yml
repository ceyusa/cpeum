name: CI
on:
  push:
    branches: [main]
    paths:
      - 'CPEUM/**'
      - 'scripts/**'
      - 'css/**'
      - '.github/workflows/main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'CPEUM/**'
      - 'scripts/**'
      - 'css/**'
      - '.github/workflows/main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install aspell aspell-es

      - name: Maximum line length
        run: awk '{ if (length($0) > 72) { print FILENAME " " FNR; exit 255 } }' CPEUM/[T0-9]*.rst

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install '3.12'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check spelling
        run: uv run pyspelling -n ortografia

      - name: Check reStructuredText syntax
        run: uv run rstcheck -r CPEUM/

      - name: Check CSS syntax
        run: npx --package @biomejs/biome@latest biome check css/

      - name: Lint Python scripts
        run: uv run ruff check scripts/

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install tidy libxml2-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install '3.12'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Generate document
        run: |
          mkdir -p html
          cd CPEUM
          uv run ../scripts/rst2html5.py toc.rst ../html/index.html
          uv run ../scripts/rst2html5.py acercade.rst ../html/acercade.html

      - name: Validate generated HTML
        run: |
          tidy -e -q html/index.html
          tidy -e -q html/acercade.html

      - name: Generate sitemap
        run: uv run scripts/sitemap.py html

      - name: Validate sitemap
        run: xmllint --noout html/sitemap.xml

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: html

  deploy-rsync:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: despliegue
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: html

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Extract artifact
        run: |
          cd html
          tar xf artifact.tar
          rm -f artifact.tar

      - name: Deploy via rsync over SSH
        run: |
          rsync -P -rvzc --delete -e 'ssh -p ${{ secrets.SSH_PORT }}' html/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/public_html
