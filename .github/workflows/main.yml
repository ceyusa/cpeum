# This is a basic workflow to help you get started with Actions

name: CI
on:
  # Triggers the workflow on push or pull request events but only for
  # the master branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run
# sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part
    # of the job
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install aspell aspell-es

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job
      # can access it
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Maximum line length
        run: awk '{ if (length($0) > 72) { print FILENAME " " FNR; exit 255 } }' CPEUM/[T0-9]*.rst

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install '3.12'

      - name: Install python dependencies
        run: uv sync --frozen

      - name: Check spelling
        run: uv run pyspelling -n ortografia

      - name: Check reStructuredText syntax
        run: uv run rstcheck -r CPEUM/

      # Runs a set of commands using the runners shell
      - name: Generate document
        run: |
          mkdir html
          cd CPEUM
          uv run ../scripts/rst2html5.py toc.rst ../html/index.html

      # Install generated document in Pages
      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: html
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
