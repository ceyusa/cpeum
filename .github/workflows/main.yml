name: CI
on:
  push:
    branches: [main]
    paths:
      - 'CPEUM/**'
      - 'cpeum-decretos/**'
      - 'scripts/**'
      - 'css/**'
      - 'run.sh'
      - '.github/workflows/main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'CPEUM/**'
      - 'cpeum-decretos/**'
      - 'scripts/**'
      - 'css/**'
      - 'run.sh'
      - '.github/workflows/main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install aspell aspell-es shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install '3.12'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check spelling
        run: uv run pyspelling -n ortografia

      - name: Check reStructuredText syntax
        run: uv run rstcheck -r CPEUM/

      - name: Check CSS syntax
        run: npx --package @biomejs/biome@latest biome check css/

      - name: Check JavaScript syntax
        run: npx --package @biomejs/biome@latest biome check scripts/*.js

      - name: Lint Python scripts (ruff)
        run: uv run ruff check scripts/

      - name: Lint Python scripts (pylint)
        run: uv run pylint scripts/

      - name: Lint shell scripts
        run: shellcheck run.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install tidy libxml2-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install '3.12'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate document
        run: |
          mkdir -p html
          uv run scripts/rst2html5.py cpeum-decretos/CPEUM/cpeum.rst html/index.html
          uv run scripts/rst2html5.py CPEUM/acercade.rst html/acercade.html
          uv run scripts/rst2html5.py CPEUM/estadisticas.rst html/estadisticas.html

      - name: Generate reformas diff
        run: node scripts/generar_reformas.js

      - name: Generate statistics charts
        run: uv run scripts/generar_graficos.py

      - name: Validate generated SVG charts
        run: xmllint --noout html/graficos/*.svg

      - name: Validate generated HTML
        run: |
          tidy -e -q html/index.html
          tidy -e -q html/acercade.html
          tidy -e -q html/estadisticas.html

      - name: Generate sitemap
        run: uv run scripts/sitemap.py html

      - name: Validate sitemap
        run: xmllint --noout html/sitemap.xml

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: html

  deploy-rsync:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: despliegue
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: html

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Extract artifact
        run: |
          cd html
          tar xf artifact.tar
          rm -f artifact.tar

      - name: Deploy via rsync over SSH
        run: |
          rsync -P -rvzc --delete -e 'ssh -p ${{ secrets.SSH_PORT }}' html/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/public_html
